name: AI Gateway Tests on Ubuntu

# Start this workflow manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The PHP server serves index.php from the repository root.
    env:
      AI_GATEWAY_URL: http://127.0.0.1:8000/index.php

    steps:
      # Make the PHP files, test script, and CSV available on the runner.
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Install Selenium, pytest, and pytest-html.
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Check the tools provided by the runner. Selenium manages ChromeDriver.
      - name: Check PHP and Chrome
        run: |
          php --version
          google-chrome --version

      # Start PHP and wait until the dashboard is ready.
      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 -t . > php-server.log 2>&1 &
          for attempt in {1..15}; do
            if curl --fail --silent --output /dev/null "$AI_GATEWAY_URL"; then
              exit 0
            fi
            sleep 1
          done
          cat php-server.log
          exit 1

      # Run the CSV test suite and generate a standalone HTML report.
      - name: Run Selenium tests and generate HTML report
        run: python -m pytest test_ai_gateway.py -v -s --html=report_ai_gateway.html --self-contained-html

      # Keep the report and screenshots available even when tests fail.
      - name: Upload Ubuntu test report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-report-ubuntu
          path: |
            report_ai_gateway.html
            screenshots_ai_gateway/
          if-no-files-found: error
